<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="OhMyGoch Trip OS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Pin de ubicación arriba a la derecha -->
  <g transform="translate(384, 96)">
    <path d="M0,0 C-26,-44 -26,-80 0,-80 C26,-80 26,-44 0,0 Z" fill="url(#pin)"/>
    <circle cx="0" cy="-56" r="10" fill="#4f46e5"/>
  </g>

  <!-- OMG -->
  <text x="240" y="336"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="176" font-weight="900" fill="#ffffff"
        text-anchor="middle" letter-spacing="-10">OMG</text>

  <!-- Camino punteado -->
  <g fill="#fcd34d">
    <circle cx="120" cy="392" r="4"/>
    <circle cx="152" cy="404" r="4"/>
    <circle cx="186" cy="414" r="4"/>
    <circle cx="222" cy="420" r="4"/>
  </g>
</svg>